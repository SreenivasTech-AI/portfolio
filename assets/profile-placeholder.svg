<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#bgGlow)" />
  
  <!-- Subtle Matrix / Circuit Lines -->
  <circle cx="200" cy="200" r="160" stroke="#1E293B" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="200" cy="200" r="130" stroke="url(#neonCyan)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.3" />
  <circle cx="200" cy="200" r="175" stroke="#334155" stroke-width="1" opacity="0.4" />

  <!-- Orbiting Nodes -->
  <circle cx="200" cy="40" r="5" fill="#06B6D4" filter="url(#glowEffect)" />
  <circle cx="360" cy="200" r="5" fill="#10B981" filter="url(#glowEffect)" />
  <circle cx="200" cy="360" r="5" fill="#8B5CF6" filter="url(#glowEffect)" />
  <circle cx="40" cy="200" r="5" fill="#3B82F6" filter="url(#glowEffect)" />

  <!-- Developer Silhouette with High-Tech AI Stylings -->
  <g transform="translate(0, 10)">
    <!-- Shoulders & Torso -->
    <path d="M110 350 C110 280, 150 250, 200 250 C250 250, 290 280, 290 350 Z" fill="#1E293B" />
    <!-- Modern Tech Jacket Lapels -->
    <path d="M150 255 L180 340 L160 350 L125 350 Z" fill="#334155" opacity="0.8" />
    <path d="M250 255 L220 340 L240 350 L275 350 Z" fill="#334155" opacity="0.8" />
    <!-- Inner Shirt / Core -->
    <path d="M180 260 L200 310 L220 260 Z" fill="#0F172A" />

    <!-- Neck -->
    <path d="M182 205 L182 260 C190 265, 210 265, 218 260 L218 205 Z" fill="#CBD5E1" />
    
    <!-- Face / Head Base -->
    <ellipse cx="200" cy="175" rx="55" ry="65" fill="#E2E8F0" />
    <!-- Sleek Modern Haircut -->
    <path d="M142 165 C140 115, 170 95, 200 95 C235 95, 260 115, 258 165 C250 145, 235 130, 200 130 C165 130, 148 145, 142 165 Z" fill="#0F172A" />
    <!-- Sleek Minimalistic Glasses / AI AR HUD Visor -->
    <rect x="160" y="155" width="34" height="22" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="2" />
    <rect x="206" y="155" width="34" height="22" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="2" />
    <line x1="194" y1="165" x2="206" y2="165" stroke="#06B6D4" stroke-width="2" />
    <!-- HUD Glow in visor -->
    <line x1="164" y1="166" x2="190" y2="166" stroke="#06B6D4" stroke-width="2" opacity="0.8" />
    <line x1="210" y1="166" x2="236" y2="166" stroke="#10B981" stroke-width="2" opacity="0.8" />
    <!-- Friendly Smile -->
    <path d="M188 205 Q200 215 212 205" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Glowing AI Hex Badge -->
  <g transform="translate(290, 270)">
    <circle cx="30" cy="30" r="28" fill="#0B0F19" stroke="url(#neonCyan)" stroke-width="2" />
    <text x="30" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#06B6D4" text-anchor="middle">AI</text>
  </g>
</svg>